[settings]
lockfile = false
experimental = true
disable_tools = ["python"]


[env]
HK_MISE = "true"

[tools]
hk = "1.29.0"
swiftformat = "0.58.7"
swiftlint = "0.63.1"
git-cliff = "2.11.0"
xcsift = "1.0.22"
pkl = "0.30.2"
swift = "latest"

[tasks.build]
description = "Build debug"
run = "swift build 2>&1 | xcsift"

[tasks."build:release"]
description = "Build release"
run = """
xcodebuild -scheme clai -configuration Release \
  -destination 'platform=macOS' \
  -derivedDataPath .build/xcode \
  -skipMacroValidation \
  build 2>&1 | xcsift
"""

[tasks.test]
description = "Run tests"
run = "swift test 2>&1 | xcsift"

[tasks."test:filter"]
description = "Run tests with filter (usage: mise run test:filter TestName)"
run = "swift test --filter {{arg(name='filter')}} 2>&1 | xcsift"

[tasks.lint]
description = "SwiftLint strict"
run = "swiftlint lint --strict Sources 2>&1 | xcsift"

[tasks.format]
description = "Format Swift code"
run = "swiftformat Sources"

[tasks."format:check"]
description = "Check formatting (CI)"
run = "swiftformat Sources --lint"

[hooks.enter]
run = "git config core.hooksPath .githooks 2>/dev/null || true"

[tasks.setup]
description = "Configure git hooks"
run = """
current=$(git config --get core.hooksPath 2>/dev/null || true)
if [ "$current" = ".githooks" ]; then
  echo "✓ Git hooks already configured"
else
  git config core.hooksPath .githooks
  echo "✓ Git hooks configured → .githooks"
fi
"""


[tasks.clean]
description = "Clean build artifacts"
run = "swift package clean && rm -rf .build/xcode .build/release .build/debug DerivedData"

[tasks.check]
description = "Run lint and format check in parallel"
depends = ["lint", "format:check"]

[tasks.ci]
description = "Full CI pipeline: build, then lint + format + test in parallel"
run = [{ task = "build" }, { tasks = ["lint", "format:check", "test"] }]

[tasks.pre-commit]
description = "Run all pre-commit checks"
run = "hk run pre-commit"

[tasks.changelog]
description = "Generate CHANGELOG.md"
run = "git-cliff -o CHANGELOG.md"

[tasks."changelog:unreleased"]
description = "Preview unreleased changes"
run = "git-cliff --unreleased"

[tasks.docs]
description = "Generate CLI documentation in Markdown"
run = "swift run clai docs"

[tasks."docs:file"]
description = "Generate CLI docs to docs/CLI.md"
run = "swift run clai docs --output docs/CLI.md"

[tasks.manpage]
description = "Generate man page"
run = "swift run clai man-page"

[tasks."manpage:file"]
description = "Generate man page to man/clai.1"
run = "mkdir -p man && swift run clai man-page --output man/clai.1"
